<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Portfolio – scratch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500&family=Pinyon+Script&family=Instrument+Serif&family=JetBrains+Mono:wght@500;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --ink: #121110;
            --paper: #f2f1ef;
            --cream: #faf9f6;
            --dark: #232122;
            --violet: #7c4dea;
            --serif: 'Instrument Serif', Georgia, serif;
            --mono: 'JetBrains Mono', ui-monospace, monospace;
            --wide: 'Unbounded', 'Syne', system-ui, sans-serif
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        html {
            scroll-snap-type: y proximity;
            scroll-behavior: smooth
        }

        html,
        body {
            background: var(--cream);
            color: var(--ink);
            font-family: system-ui, -apple-system, sans-serif
        }

        section {
            scroll-snap-align: start
        }

        /* ===== PAGE 1: title ===== */
        .p1 {
            position: relative;
            min-height: 100svh;
            display: grid;
            align-items: center;
            overflow: hidden;
            background: var(--cream);
            font-family: var(--wide)
        }

        .glow {
            position: absolute;
            left: 18%;
            top: 28%;
            width: 42vw;
            height: 42vw;
            border-radius: 50%;
            background: radial-gradient(circle, #fff 0%, transparent 65%);
            pointer-events: none
        }

        .ptitle {
            position: relative;
            margin-left: clamp(24px, 19vw, 300px);
            padding-bottom: 6vh
        }

        .big {
            position: relative;
            isolation: isolate;
            font-weight: 300;
            font-size: clamp(46px, 9vw, 150px);
            line-height: 1;
            letter-spacing: -.04em;
            white-space: nowrap
        }

        .fadeb {
            -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .08), #000 62%);
            mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .08), #000 62%)
        }

        .o {
            position: relative;
            display: inline-block;
            width: .8em;
            height: .6em;
            margin: 0 .05em;
            vertical-align: baseline
        }

        .o .el {
            position: absolute;
            inset: -6% -8%;
            width: 116%;
            height: 112%;
            overflow: visible
        }

        .o .star {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 1.6em;
            height: 1.6em;
            margin: -.95em 0 0 -.8em;
            filter: blur(5px);
            opacity: .92;
            animation: spin 22s linear infinite;
            z-index: -1
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .pill {
            position: absolute;
            left: .4%;
            top: 78%;
            padding: .35em 1em .4em;
            border-radius: 99px;
            background: #8b5cf6;
            color: #fff;
            font: 300 italic clamp(16px, 2.5vw, 38px)/1.1 var(--wide);
            transform: rotate(-2.5deg);
            white-space: nowrap
        }

        .sig {
            margin: clamp(34px, 8vh, 90px) 0 0 -.6%;
            font: 400 clamp(40px, 5.6vw, 84px)/1 'Pinyon Script', cursive
        }

        .hint {
            position: absolute;
            left: 50%;
            bottom: 3.5vh;
            translate: -50% 0;
            font: 500 11px var(--mono);
            letter-spacing: .2em;
            opacity: .45
        }

        /* page 1 dragon */
        .dragon {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            animation: dfade 1.6s .4s both
        }

        @keyframes dfade {
            from {
                opacity: 0
            }
        }

        .ptitle {
            z-index: 2
        }

        @media (prefers-reduced-motion:reduce) {
            .o .star {
                animation: none
            }
        }

        /* ===== PAGE 2: about / skills / tools ===== */
        .p2 {
            min-height: 100svh;
            display: grid;
            grid-template-columns: minmax(300px, 34%) 1fr;
            font-family: var(--wide);
            font-weight: 300
        }

        .ab {
            background: var(--dark);
            color: #fff;
            padding: 5vh 4vw 0;
            display: flex;
            flex-direction: column
        }

        .ab h2 {
            font-weight: 300;
            font-size: clamp(58px, 8.4vw, 128px);
            line-height: .92;
            letter-spacing: -.04em
        }

        .ab p {
            margin: 3.5vh 0 4vh;
            font-size: clamp(12px, 1.05vw, 15px);
            line-height: 1.5;
            text-align: justify;
            white-space: pre-line
        }

        .photo {
            flex: 1;
            min-height: 260px;
            border-radius: 28px 28px 0 0;
            overflow: hidden;
            background: linear-gradient(160deg, #d8d4d0, #8f8a86 60%, #2b2928);
            display: grid;
            place-items: center;
            color: #fff;
            font: 500 11px var(--mono);
            letter-spacing: .2em
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .rt {
            display: grid;
            grid-template-rows: 57fr 43fr
        }

        .sk {
            background: var(--violet);
            color: #fff;
            padding: 4vh 4vw
        }

        .sk h2,
        .tl h2 {
            font-weight: 300;
            font-size: clamp(52px, 7vw, 108px);
            line-height: 1;
            letter-spacing: -.04em
        }

        .cols {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 4vw;
            margin-top: 4vh
        }

        .tag {
            display: inline-block;
            padding: .5em 1.1em;
            border-radius: 99px;
            background: var(--dark);
            font: 300 italic clamp(14px, 1.6vw, 22px) var(--wide);
            margin-bottom: 3vh
        }

        .sk ul {
            list-style: none;
            padding: 0;
            font-size: clamp(11px, 1.05vw, 15px);
            line-height: 1.55
        }

        .sk li {
            padding-left: 1.1em;
            position: relative;
            margin-bottom: .2em
        }

        .sk li:before {
            content: '•';
            position: absolute;
            left: 0
        }

        .tl {
            background: var(--cream);
            padding: 3vh 4vw
        }

        .tl h2 {
            background: linear-gradient(90deg, #7c4dea, #b79cf5);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            width: fit-content
        }

        .tools {
            display: flex;
            flex-wrap: wrap;
            gap: clamp(12px, 1.6vw, 26px);
            margin-top: 3vh
        }

        .tool {
            display: grid;
            justify-items: center;
            gap: 8px;
            font-size: clamp(11px, 1vw, 14px)
        }

        .tool i {
            width: clamp(56px, 5.4vw, 78px);
            aspect-ratio: 1;
            border-radius: 22%;
            display: grid;
            place-items: center;
            font: 500 normal clamp(18px, 2vw, 28px) var(--wide);
            box-shadow: 0 4px 14px rgba(0, 0, 0, .12);
            overflow: hidden
        }

        .tool i img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        /* ===== PAGE 3: reels (loader -> wheel) ===== */
        .reel {
            position: relative;
            height: 100svh;
            overflow: hidden;
            display: grid;
            grid-template-rows: 84px 1fr auto;
            padding: 0 20px;
            background: var(--cream);
            font-family: var(--wide);
            font-weight: 300
        }

        .brand {
            position: absolute;
            left: 36px;
            top: 26px;
            z-index: 6;
            font: 300 76px/1 var(--wide);
            letter-spacing: -.05em;
            transform-origin: 0 0;
            pointer-events: none
        }

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            font: 300 13px var(--wide)
        }

        .top .sp {
            width: 215px
        }

        .top nav {
            display: flex;
            gap: 8px;
            margin-right: auto;
            opacity: 0;
            overflow-x: auto;
            scrollbar-width: none;
            padding: 4px
        }

        .top nav::-webkit-scrollbar {
            display: none
        }

        .f {
            font: 300 12px var(--wide);
            padding: .8em 1.35em;
            border-radius: 99px;
            border: 1px solid rgba(124, 77, 234, .2);
            background: rgba(250, 249, 246, .78);
            color: var(--ink);
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 4px 14px rgba(35, 33, 34, .05);
            transition: transform .25s ease, background .25s ease, color .25s ease, border-color .25s ease, box-shadow .25s ease
        }

        .f:hover:not(:disabled) {
            border-color: var(--violet);
            color: var(--violet);
            background: #fff;
            box-shadow: 0 8px 20px rgba(124, 77, 234, .14);
            transform: translateY(-2px)
        }

        .f.on {
            background: var(--dark);
            border-color: var(--dark);
            color: #fff;
            box-shadow: 0 8px 20px rgba(35, 33, 34, .18)
        }

        .f.on:hover:not(:disabled) {
            color: #fff;
            background: var(--violet);
            border-color: var(--violet)
        }

        .f:disabled {
            cursor: default
        }

        .f:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(124, 77, 234, .22), 0 8px 20px rgba(124, 77, 234, .14)
        }

        .sel {
            position: absolute;
            left: 22px;
            bottom: 20px;
            z-index: 4;
            display: flex;
            align-items: flex-end;
            gap: 26px;
            padding: 14px 22px 16px;
            border-radius: 22px;
            background: rgba(250, 249, 246, .72);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            pointer-events: none;
            max-width: calc(100% - 44px)
        }

        .sel small {
            display: block;
            font: 400 10px var(--serif);
            letter-spacing: .14em;
            text-transform: uppercase;
            opacity: .55;
            margin-bottom: 6px
        }

        .sel b {
            display: block;
            font: 300 clamp(24px, 3.6vw, 54px)/1 var(--wide);
            letter-spacing: -.04em;
            color: var(--violet)
        }

        .sel em {
            font: 400 12px var(--serif);
            font-style: italic;
            color: var(--violet);
            white-space: nowrap;
            padding-bottom: 4px
        }

        .top a {
            color: inherit;
            text-decoration: none;
            opacity: .7
        }

        .top a:hover {
            opacity: 1
        }

        .top .cta {
            opacity: 0;
            padding: .8em 1.5em;
            border-radius: 99px;
            background: var(--dark);
            color: #fff;
            opacity: 0
        }

        .top .cta:hover {
            background: var(--violet)
        }

        .stage {
            position: relative;
            perspective: 2200px;
            touch-action: pan-y;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden
        }

        .stage.drag {
            cursor: grabbing
        }

        .bound {
            position: absolute;
            inset: 0;
            overflow: hidden;
            border-radius: 28px;
            pointer-events: none
        }

        .sky {
            position: absolute;
            inset: 0;
            opacity: 0;
            background: radial-gradient(80% 55% at 78% 8%, #cfbcff 0%, transparent 62%), radial-gradient(60% 45% at 12% 18%, #b79cf5 0%, transparent 60%), linear-gradient(#232122 0%, #3b2a8f 40%, #7c4dea 70%, #f2f1ef 100%)
        }

        .bound.cl {
            z-index: 3
        }

        .scene {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d;
            will-change: transform;
            transition: opacity 0.38s ease
        }

        .card {
            position: absolute;
            left: 50%;
            top: 50%;
            display: block;
            width: var(--w);
            height: var(--h);
            margin: calc(var(--h)/-2) 0 0 calc(var(--w)/-2);
            transform-style: preserve-3d;
            visibility: hidden;
            will-change: transform;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            -webkit-user-drag: none;
            cursor: pointer
        }

        .card:focus-visible {
            outline: 3px solid var(--violet);
            outline-offset: 4px
        }

        .face {
            position: absolute;
            inset: 0;
            border-radius: 10px;
            overflow: hidden;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            box-shadow: 0 14px 34px rgba(0, 0, 0, .28);
            transition: box-shadow 0.25s ease, outline 0.25s ease
        }

        .card:hover .face {
            box-shadow: 0 20px 45px rgba(18, 17, 16, .3), 0 0 24px rgba(124, 77, 234, .42);
            outline: 2px solid rgba(124, 77, 234, .7);
            outline-offset: -2px
        }

        .front img,
        .front video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            -webkit-user-drag: none
        }

        .front video {
            opacity: 0;
            transition: opacity .5s
        }

        .cap {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 22px 10px 9px;
            font: 300 10px var(--wide);
            letter-spacing: .02em;
            background: linear-gradient(transparent, rgba(0, 0, 0, .6))
        }

        .back {
            transform: rotateY(180deg);
            background: radial-gradient(circle at 30% 20%, #4a4547, var(--dark));
            display: grid;
            place-items: center;
            border: 1px solid #3d393b;
            font: 400 calc(var(--w)*.5)/1 'Pinyon Script', var(--serif);
            color: #b79cf5
        }

        .clouds {
            position: absolute;
            left: -5%;
            right: -5%;
            bottom: 0;
            height: 52%;
            will-change: transform;
            transform: translate3d(0, 100%, 0);
            visibility: hidden
        }

        .clouds i {
            position: absolute;
            border-radius: 50%
        }

        .clouds .base {
            left: 0;
            right: 0;
            bottom: 0;
            height: 55%;
            border-radius: 0;
            background: linear-gradient(#faf9f6, #ebe5f8)
        }

        .copy {
            position: relative;
            z-index: 4;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 32px;
            padding: 22px 16px 26px;
            opacity: 0
        }

        .copy h1 {
            font: 300 clamp(22px, 3.1vw, 46px)/1.08 var(--wide);
            letter-spacing: -.04em;
            max-width: 19em
        }

        .copy h1 u {
            text-decoration-thickness: 3px;
            text-underline-offset: 5px
        }

        .copy h1 sup {
            font: 400 9px var(--wide);
            margin-left: 2px;
            color: var(--violet)
        }

        .stats {
            display: flex;
            gap: 34px;
            text-align: right
        }

        .stats b {
            display: block;
            font: 300 clamp(24px, 3vw, 44px)/1 var(--wide);
            letter-spacing: -.05em;
            color: var(--violet)
        }

        .stats span {
            font: 300 9px var(--wide);
            letter-spacing: .16em;
            opacity: .6
        }

        .counter {
            position: absolute;
            right: 40px;
            bottom: 30px;
            z-index: 10;
            text-align: right;
            transition: opacity .4s
        }

        .counter small {
            display: block;
            font: 300 11px var(--wide);
            letter-spacing: .2em;
            opacity: .6;
            margin-bottom: 8px
        }

        .counter b {
            font: 300 clamp(64px, 10vw, 150px)/.9 var(--wide);
            letter-spacing: -.06em
        }

        .counter em {
            font: 300 clamp(20px, 2.2vw, 32px) var(--wide);
            font-style: normal;
            margin-left: 8px;
            color: var(--violet)
        }

        .skip {
            position: absolute;
            left: 36px;
            bottom: 30px;
            z-index: 10;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid #d6d1e6;
            background: transparent;
            cursor: pointer;
            font-size: 16px;
            color: var(--ink)
        }

        .skip:hover {
            background: var(--violet);
            color: #fff;
            border-color: var(--violet)
        }

        .skip:focus-visible {
            outline: 2px solid var(--violet);
            outline-offset: 3px
        }

        /* ===== SPREAD VIEW (flat category grid overlay) ===== */
        @keyframes spreadIn {
            from {
                opacity: 0;
                transform: translateY(12px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        @keyframes spreadOut {
            from {
                opacity: 1;
                transform: translateY(0)
            }

            to {
                opacity: 0;
                transform: translateY(12px)
            }
        }

        .spread {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            pointer-events: none;
            animation: spreadIn 0.38s cubic-bezier(0.2, 0.8, 0.3, 1) forwards
        }

        .spread.out {
            animation: spreadOut 0.32s cubic-bezier(0.5, 0, 0.8, 0.3) forwards;
            pointer-events: none
        }

        .spread-inner {
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            justify-content: center;
            gap: var(--sg, 16px);
            width: 100%;
            padding: 0 32px;
            pointer-events: auto;
            overflow: hidden
        }

        .spread-card {
            position: relative;
            width: var(--sw, 180px);
            height: calc(var(--sw, 180px) * 16 / 9);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 14px 34px rgba(0, 0, 0, .28);
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease, outline 0.25s ease
        }

        .spread.tuff .spread-card {
            width: var(--sw, 150px);
            height: calc(var(--sw, 150px) * 16 / 9)
        }

        .spread-card:hover {
            transform: translateY(-8px) scale(1.025);
            box-shadow: 0 22px 48px rgba(0, 0, 0, .45), 0 0 26px rgba(139, 92, 246, 0.6);
            outline: 2px solid rgba(139, 92, 246, 0.8);
            outline-offset: -2px
        }

        .spread-card:focus-visible {
            outline: 3px solid var(--violet);
            outline-offset: 4px
        }

        .spread-card img,
        .spread-card video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none
        }

        .spread-card video {
            opacity: 0;
            transition: opacity .4s
        }

        .spread-card video.playing {
            opacity: 1
        }

        .spread-card .cap {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 22px 10px 9px;
            font: 300 10px var(--wide);
            letter-spacing: .02em;
            color: #fff;
            background: linear-gradient(transparent, rgba(0, 0, 0, .6))
        }

        @media (max-width:860px) {
            .p2 {
                grid-template-columns: 1fr
            }

            .ab {
                padding-bottom: 0
            }

            .photo {
                min-height: 340px
            }

            .cols {
                grid-template-columns: 1fr
            }

            .rt {
                grid-template-rows: auto auto
            }

            .sk,
            .tl {
                padding: 6vh 6vw
            }

            .ab {
                padding: 6vh 6vw 0
            }
        }

        @media (max-width:760px) {
            .reel {
                grid-template-rows: 64px 1fr auto;
                padding: 0 10px
            }

            .brand {
                font-size: 54px;
                left: 20px;
                top: 18px
            }

            .top .sp {
                width: 135px
            }

            .top nav {
                gap: 6px
            }

            .f {
                font-size: 11px;
                padding: .7em 1.05em
            }

            .top .cta {
                display: none
            }

            .copy {
                flex-direction: column;
                align-items: flex-start;
                gap: 14px
            }

            .stats {
                text-align: left;
                gap: 22px
            }

            .counter {
                right: 20px
            }

            .skip {
                left: 20px
            }
        }

        /* ===== PAGE 4: liquid glass carousel ===== */
        .p4 {
            min-height: 0;
            padding: 0;
            background: #faf8f5;
        }

        .graphic-page {
            display: block;
            padding: 7vh 36px 2vh;
            background: var(--cream);
            color: var(--ink);
            font: 300 clamp(44px, 5vw, 76px)/1 var(--wide);
            letter-spacing: -.05em;
        }

        .p4 iframe {
            display: block;
            width: 100%;
            height: clamp(760px, 110svh, 1100px);
            border: 0;
        }

        /* ===== YOUTUBE PREVIEW MODAL ===== */
        .yt-modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(14px, 3vw, 36px);
            cursor: pointer;
            background:
                radial-gradient(60% 50% at 82% 8%, rgba(183, 156, 245, .55), transparent 62%),
                radial-gradient(50% 45% at 8% 92%, rgba(139, 92, 246, .28), transparent 60%),
                rgba(242, 241, 239, .74);
            -webkit-backdrop-filter: blur(22px);
            backdrop-filter: blur(22px);
            animation: ytFadeIn .28s ease forwards;
        }

        @keyframes ytFadeIn {
            from {
                opacity: 0
            }

            to {
                opacity: 1
            }
        }

        .yt-modal-dialog {
            position: relative;
            cursor: default;
            display: flex;
            flex-direction: column;
            max-height: 94vh;
            max-width: 96vw;
            background: var(--dark);
            color: #fff;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 40px 90px -24px rgba(35, 33, 34, .55), 0 0 0 1px rgba(35, 33, 34, .06);
            animation: ytPopIn .4s cubic-bezier(.16, 1, .3, 1) forwards;
            font-family: var(--wide);
            font-weight: 300;
        }

        .yt-modal-dialog.is-short {
            flex-direction: row;
        }

        @keyframes ytPopIn {
            from {
                opacity: 0;
                transform: translateY(18px) scale(.95)
            }

                })));
                covers.then(() => { coversReady = true; tryDeal(); });
                Promise.all([covers, previews]).then(() => { ready = true; maybeLift(); });

                const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { inView = true; tryDeal(); io.disconnect(); } }, { threshold: 0.6 });
                io.observe(secRef.current);

                const onKey = e => { if (e.key === 'Escape' || e.key === 'Tab') skipRef.current(); };
                window.addEventListener('keydown', onKey);
                return () => { window.removeEventListener('keydown', onKey); io.disconnect(); };
            }, []);

            /* 5. GESTURES: drag, swipe, horizontal wheel -> target angle (vertical wheel scrolls the page).
               A tap opens the card that was under the pointer on PRESS, so it works even while the wheel is moving. */
            useEffect(() => {
                const stage = stageRef.current, DEG_PER_PX = 0.09;
                let down = false, startX = 0, lastX = 0, lastT = 0, downCard = null;
                const pd = e => {
                    if (e.button > 0) return;
                    if (e.target.closest('.spread')) { S.dragged = false; return; }   // flat grid handles its own clicks
                    down = true; S.drag = true; S.vel = 0; S.dragged = false;
                    downCard = e.target.closest('.card');              // card under the pointer NOW, before the wheel moves
                    startX = lastX = e.clientX; lastT = performance.now(); stage.classList.add('drag');
                };
                const pm = e => {
                    if (!down) return;
                    const now = performance.now(), dd = (e.clientX - lastX) * DEG_PER_PX;
                    if (Math.abs(e.clientX - startX) > 5) S.dragged = true;
                    S.target += dd;
                    const dt = Math.max(1, now - lastT) / 1000;
                    S.vel = S.vel * 0.6 + (dd / dt) * 0.4;
                    lastX = e.clientX; lastT = now;
                };
                const pu = e => {
                    if (!down) return; down = false; S.drag = false; stage.classList.remove('drag');
                    if (e.type === 'pointerup' && !S.dragged && downCard) {
                        const w = WORK[(+downCard.dataset.i) % WORK.length];
                        if (w) openPreview(w);                          // tap = open, even while the wheel is moving
                    }
                    downCard = null;
                    if (performance.now() - lastT > 80) S.vel = 0;
                    S.vel = clamp(S.vel, -700, 700);
                };
                const wheel = e => {
                    const horiz = Math.abs(e.deltaX) > Math.abs(e.deltaY) || e.shiftKey;
                    if (!horiz) return;                                          // let vertical scroll move the page
                    e.preventDefault();
                    S.target -= (e.deltaX || e.deltaY) * 0.04;
                };
                stage.addEventListener('pointerdown', pd);
                window.addEventListener('pointermove', pm);
                window.addEventListener('pointerup', pu);
                window.addEventListener('pointercancel', pu);
                stage.addEventListener('wheel', wheel, { passive: false });
                return () => {
                    stage.removeEventListener('pointerdown', pd); window.removeEventListener('pointermove', pm);
                    window.removeEventListener('pointerup', pu); window.removeEventListener('pointercancel', pu);
                    stage.removeEventListener('wheel', wheel);
                };
            }, []);

            const fade = y => ({
                initial: false,
                animate: { opacity: ui.on ? 1 : 0, y: ui.on ? 0 : y },
                transition: { duration: ui.instant ? 0 : 0.9, delay: ui.delay, ease: 'easeOut' }
            });
            /* FILTERS */
            const allSlots = Array.from({ length: N }, (_, i) => WORK[i % WORK.length]);
            const selCount = (sel ? WORK.filter(w => w.cat === sel) : WORK).length;
            const selLabel = sel ? CATEGORIES.find(c => c.id === sel).label : 'All work';
            const [spreadOut, setSpreadOut] = useState(false);
            const timerRef = useRef(null);
            /* sel pill: measure element to compute center x-offset */
            const selRef = useRef();
            const [selX, setSelX] = useState(0);
            useEffect(() => {
                const compute = () => {
                    const el = selRef.current;
                    if (!el || !ui.on) return;
                    // When no filter: center pill. When filter active: snap back to left (x=0)
                    setSelX(sel ? 0 : Math.round(window.innerWidth / 2 - el.offsetWidth / 2 - 22));
                };
                // tiny delay lets React paint the new label before we measure
                const t = setTimeout(compute, 0);
                window.addEventListener('resize', compute);
                return () => { clearTimeout(t); window.removeEventListener('resize', compute); };
            }, [sel, ui.on]);

            const openPreview = w => {
                S.vel = 0;
                resetRef.current();
                setPreviewVideo(w);
            };

            const pick = id => {
                if (!doneRef.current) return;
                const next = sel === id ? null : id;
                setSel(next);
                clearTimeout(timerRef.current);
                if (next === null && applied) {
                    // fade the spread out, then unmount after animation
                    setSpreadOut(true);
                    timerRef.current = setTimeout(() => { setApplied(null); setSpreadOut(false); resetRef.current(); }, 340);
                } else {
                    setSpreadOut(false);
                    setApplied(next);        // no flushSync – avoids blocking the rAF loop
                    resetRef.current();
                }
            };
            /* Spread view: the flat grid shown when a category is active */
            const spreadItems = (applied || spreadOut) ? WORK.filter(w => w.cat === (applied || sel)) : [];
            const U = (c, t, n) => h('span', null, h('u', { style: { textDecorationColor: c } }, t), h('sup', null, n));

            return h('section', { className: 'reel', id: 'reel', ref: secRef },
                h(motion.div, {
                    className: 'brand', initial: false, animate: { scale: ui.on ? 0.42 : 1 },
                    transition: { duration: ui.instant ? 0 : 1.5, ease: [0.5, 0, 0.15, 1] }
                }, BRAND),
                h('header', { className: 'top' },
                    h('span', { className: 'sp' }),
                    h(motion.nav, { 'aria-label': 'Filter videos', ...fade(-10) },
                        CATEGORIES.map(c => h('button', { key: c.id, className: 'f' + (sel === c.id ? ' on' : ''), 'aria-pressed': sel === c.id, disabled: !done, onClick: () => pick(c.id) }, c.label)))),
                h('div', {
                    className: 'stage', ref: stageRef,
                    onClickCapture: e => { if (S.dragged) { e.preventDefault(); e.stopPropagation(); S.dragged = false; } }
                },
                    h('div', { className: 'bound' }, h('div', { className: 'sky', ref: skyRef, style: SKY_IMAGE ? { backgroundImage: `url("${SKY_IMAGE}")`, backgroundSize: 'cover', backgroundPosition: 'center' } : undefined })),
                    h('div', { className: 'scene', ref: sceneRef, style: { opacity: applied ? 0 : 1, pointerEvents: applied ? 'none' : 'auto' } },
                        allSlots.map((c, i) => h('a', {
                            key: i, className: 'card', 'data-i': i, href: '#work-' + (i + 1), draggable: false, 'aria-label': c.title + ' – watch on YouTube',
                            onClick: e => {
                                e.preventDefault();
                                if (e.detail === 0) openPreview(c);   // keyboard Enter only; mouse/touch handled on pointerup
                            }
                        },
                            h('div', { className: 'face front' },
                                h('img', { className: 'cover', src: c.cover, alt: '', draggable: false }),
                                h('video', { src: c.video, loop: true, muted: true, playsInline: true, preload: 'none', tabIndex: -1, 'aria-hidden': true }),
                                h('div', { className: 'cap' }, c.title)),
                            h('div', { className: 'face back', 'aria-hidden': true }, MONO)))),
                    /* Flat spread overlay */
                    (applied || spreadOut) && h(SpreadView, { items: spreadItems, fadeOut: spreadOut, onOpen: openPreview, modalOpen: !!previewVideo }),
                    h(motion.div, {
                        className: 'sel', ref: selRef,
                        initial: false,
                        animate: {
                            opacity: ui.on ? 1 : 0,
                            y: ui.on ? 0 : 12,
                            x: ui.on ? selX : 0
                        },
                        transition: {
                            x: { duration: 0.55, ease: [0.4, 0, 0.2, 1] },
                            opacity: { duration: ui.instant ? 0 : 0.9, delay: ui.on ? ui.delay : 0, ease: 'easeOut' },
                            y: { duration: ui.instant ? 0 : 0.9, delay: ui.on ? ui.delay : 0, ease: 'easeOut' }
                        }
                    },
                        h('div', null,
                            h('small', null, sel ? 'tap again to clear' : 'Now showing'),
                            h(motion.b, { key: sel || 'all', initial: { opacity: 0, y: 8 }, animate: { opacity: 1, y: 0 }, transition: { duration: 0.4, ease: 'easeOut' } }, selLabel)),
                        h('em', null, selCount + (selCount === 1 ? ' video' : ' videos')))),
                !done && h('div', { className: 'counter', style: { opacity: ui.on ? 0 : 1 } },
                    h('small', null, 'LOADING REELS'), h('b', { ref: numRef }, '000'), h('em', null, '%')),
                started && !done && h('button', { className: 'skip', 'aria-label': 'Skip intro', title: 'Skip intro', onClick: () => skipRef.current() }, '↗'),
                previewVideo && h(VideoModal, { item: previewVideo, onClose: () => setPreviewVideo(null) }));
        }

        function LiquidGlass() {
            return h('section', { className: 'p4', id: 'liquid-glass' },
                h('h2', { className: 'graphic-page' }, 'graphic designing (under construction)'),
                h('iframe', {
                    src: 'liquid-glass-carousel.html',
                    title: 'Liquid glass project carousel',
                    loading: 'lazy'
                }));
        }

        window.addEventListener('message', e => {
            if (e.data && e.data.type === 'liquid-carousel-page-wheel') {
                window.scrollBy({ top: e.data.deltaY, behavior: 'auto' });
            }
        });

        function Site() {
            return h(React.Fragment, null,
                h(Intro),
                h(About),
                h(ReelHero),
                h(LiquidGlass)
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(h(Site));
    </script>
</body>

</html>
