<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid Glass Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --page-bg: #faf8f5;
    --wide: 'Unbounded', 'Syne', system-ui, sans-serif;
    --hero-bg: url("dreamy-cloudscape-pastel-colors.jpg") center / cover no-repeat;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--page-bg);
    color: #111;
    font-family: var(--wide);
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
  .headline { margin: 28px 46px 80px; font: 300 clamp(40px, 6vw, 88px)/1 var(--wide); letter-spacing: -0.04em; }
  /* The hero card that holds the effect. The canvas is transparent, so this background shows through. */
  #carousel { position: relative; margin: 25px 25px 0; height: clamp(480px, 72vh, 700px); border-radius: 32px; overflow: hidden; isolation: isolate; background: var(--hero-bg); color: #111; outline: none; }
  #carousel:focus-visible { box-shadow: inset 0 0 0 2px rgba(0,0,0,.2); }
  #mount { position: absolute; inset: 0; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
  .label { position: absolute; left: 50%; margin: 0; z-index: 10; text-align: center; font-weight: 500; letter-spacing: -0.02em; color: #000; opacity: 0; pointer-events: none; }
  #title { top: 4.5%; font-size: 17px; }
  #counter { bottom: 6%; font-size: 15px; font-variant-numeric: tabular-nums; }
  #cursor { position: absolute; left: 0; top: 0; z-index: 20; font-size: 13px; font-weight: 500; color: #000; mix-blend-mode: exclusion; pointer-events: none; }
  #close { position: absolute; right: 4%; top: 4.5%; z-index: 20; font: 500 13px inherit; font-family: inherit; color: #000; mix-blend-mode: exclusion; background: none; border: 0; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .3s; }
  #fallback { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: #666; font-size: 14px; text-align: center; padding: 24px; }
  @media (max-width: 639px) { #title { font-size: 15px; } #counter { font-size: 13px; } }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="carousel" tabindex="0" role="region" aria-roledescription="carousel" aria-labelledby="label">
  <p id="label" class="sr-only">Liquid glass project carousel</p>
  <p id="live" class="sr-only" aria-live="polite"></p>
  <div id="mount"></div>

  <button id="close" type="button" aria-label="Close focused project">Close</button>

<h1 class="headline">I cut films for brands, reels for creators.</h1>

<script type="module">
import * as THREE from "three";

/* ---------- CONFIG: edit your images here ---------- */
const PORTRAIT_ASPECT = 3 / 4;
const photo = (id) => `https://images.unsplash.com/photo-${id}?w=900&h=1200&q=85&auto=format&fit=crop`;
const ITEMS = [
  { title: "Project One", src: photo("1600585154340-be6161a56a0c"), aspect: PORTRAIT_ASPECT },
  { title: "Project Two", src: photo("1514906689926-25ba6dcb584b"), aspect: PORTRAIT_ASPECT },
  { title: "Project Three", src: photo("1568557412756-7d219873dd11"), aspect: PORTRAIT_ASPECT },
  { title: "Project Four", src: photo("1581892805885-73bdd91beff0"), aspect: PORTRAIT_ASPECT },
  { title: "Project Five", src: photo("1482938289607-e9573fc25ebb"), aspect: PORTRAIT_ASPECT },
  { title: "Project Six", src: photo("1610846202780-b4d9837371ea"), aspect: PORTRAIT_ASPECT },
  { title: "Project Seven", src: photo("1527630941-4a229fd674ab"), aspect: PORTRAIT_ASPECT },
  { title: "Project Eight", src: photo("1603786420263-ad59136a7409"), aspect: PORTRAIT_ASPECT },
];
const OPTIONS = { panelHeight: 450, gap: 12, background: "#ffffff", entry: true };

const LENS = {
  sizeX: 0.9, sizeY: 1.15, posX: 0.5, posY: 0.5, rotation: 25, spin: 0, zoom: 0,
  dispersion: 18, blur: 2, glow: 8, whiteGlow: 0.3, novaSize: 14, blueRing: 3,
  ringRadius: 0.49, ringWidth: 0.014, shimmer: true, shimmerFreq: 12, shimmerSpeed: 3.5,
  shimmerDepth: 0.18, rimStart: 0.52, rimTangential: 1.1, rimInward: 0, rimFreq1: 2,
  rimFreq2: 1, blueColor: "#4bbcff", rimLine: 0.7, rimLinePos: 0.488, rimLineWidth: 0.003,
  vignette: 0, vignetteSize: 0.3, samples: 16,
};
const FOCUS = { cardDuration: 0.7, focusDuration: 0.9, cardEase: "power4.out", focusEase: "power3.out", stagger: 0.06, dropDist: 1.4, centerScale: 1.18, lensFade: 0.85 };
const ENTRY = { delay: 0.5, startH: 80, riseDuration: 1.0, stagger: 0.07, riseEase: "power3.out", fromBelow: 0.9, growDelay: 0.25, growDuration: 2.15, growEase: "expo.inOut", growStagger: 0.085, lensBloom: 1.4, lensBloomEase: "power2.inOut" };

const LENS_VERTEX = `
varying vec2 vUv;
void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
`;

const LENS_FRAGMENT = `
#define PI 3.14159265
precision highp float;
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uRes;
uniform vec2 uCenter;
uniform float uSizeX;
uniform float uSizeY;
uniform float uAspect;
uniform float uZoom;
uniform float uDispersion;
uniform float uBlur;
uniform float uGlow;
uniform float uWhiteGlow;
uniform float uNovaSize;
uniform float uBlueRing;
uniform float uRingRadius;
uniform float uRingWidth;
uniform float uShimmer;
uniform float uShimmerFreq;
uniform float uShimmerSpeed;
uniform float uShimmerDepth;
uniform float uTime;
uniform float uRimStart;
uniform float uRimTangential;
uniform float uRimInward;
uniform float uRimFreq1;
uniform float uRimFreq2;
uniform vec3 uBlueColor;
uniform float uRimLine;
uniform float uRimLinePos;
uniform float uRimLineWidth;
uniform float uVignette;
uniform float uVignetteSize;
uniform float uShape;
uniform float uSquareRound;
uniform float uRotation;
uniform int uSamples;

const int MAX_SAMPLES = 16;
float gLensA = 0.0;

float sdRoundBox(vec2 p, vec2 b, float r){
  vec2 q = abs(p) - b + r;
  return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;
}

vec3 discLens(vec2 center, float aspectCorrect, out float outA) {
  vec2 p = (vUv - center);
  p.x *= aspectCorrect;
  float ca = cos(uRotation), sa = sin(uRotation);
  p = mat2(ca, -sa, sa, ca) * p;
  vec2 halfSize = vec2(uSizeX, uSizeY);
  float dist = length(p / halfSize);
  outA = 0.0;

  float maskND;
  if (uShape > 0.5) {
    float corner = min(uSizeX, uSizeY) * clamp(uSquareRound, 0.0, 1.0);
    float sd = sdRoundBox(p, halfSize, corner);
    maskND = 1.0 + sd / min(uSizeX, uSizeY);
  } else {
    maskND = dist;
  }
  if (maskND > 1.0) return vec3(0.0);

  float shapeND = clamp(maskND, 0.0, 1.0);
  float nd = clamp(dist, 0.0, 1.0);
  vec2 offset = vUv - center;
  vec2 radialDir = normalize(offset + 1e-6);
  vec2 tangentDir = vec2(-radialDir.y, radialDir.x);
  float angle = atan(p.y, p.x);

  float pull = uZoom * 0.30 * (nd * nd);
  float rimStrength = smoothstep(uRimStart, 1.0, nd);
  float fluidWave = sin(angle * uRimFreq1) * 0.55 + sin(angle * uRimFreq2) * 0.25;
  float rScreen = (uSizeX + uSizeY) * 0.5;
  vec2 rimOff = tangentDir * fluidWave * rimStrength * rScreen * uRimTangential;
  vec2 rimPull = -radialDir * rimStrength * rScreen * uRimInward;

  vec2 baseUV = center + offset * (1.0 - pull) + rimOff + rimPull;

  float rimMask = smoothstep(0.55, 1.0, nd);
  vec2 dispDir = offset * uDispersion * 0.004 * rimMask;
  int N = uSamples;
  if (N < 2) N = 2;
  if (N > MAX_SAMPLES) N = MAX_SAMPLES;
  vec3 col = vec3(0.0);
  vec3 caW = vec3(0.0);
  float aAcc = 0.0; float aW = 0.0;
  for (int i = 0; i < MAX_SAMPLES; i++) {
    if (i >= N) break;
    float t = float(i) / float(N - 1);
    vec2 sUV = baseUV + dispDir * (t - 0.5);
    vec4 s4 = texture2D(uTex, sUV);
    vec3 s = s4.rgb;
    vec3 w = vec3(
      exp(-pow((t - 0.00) / 0.38, 2.0)),
      exp(-pow((t - 0.50) / 0.38, 2.0)),
      exp(-pow((t - 1.00) / 0.38, 2.0))
    );
    col += s * w;
    aAcc += s4.a * w.y; aW += w.y;
    caW += w;
  }
  col /= max(caW, vec3(0.001));
  float sampA = aAcc / max(aW, 0.001);

  float blurFade = 1.0 - smoothstep(0.72, 0.98, nd);
  if (uBlur > 0.01 && blurFade > 0.01) {
    vec2 blurRad = vec2(uBlur) / uRes * blurFade;
    vec3 bcol = vec3(0.0);
    float btw = 0.0;
    for (float a = 0.0; a < PI * 2.0; a += PI * 2.0 / 6.0) {
      for (float rr = 0.4; rr <= 1.001; rr += 0.3) {
        vec2 o = vec2(cos(a), sin(a)) * blurRad * rr;
        float w = 1.0 - rr * 0.38;
        bcol += texture2D(uTex, baseUV + o).rgb * w;
        btw += w;
      }
    }
    col = mix(bcol / btw, col, rimMask);
  }

  col *= mix(0.91, 1.0, smoothstep(0.0, 0.38, shapeND));

  vec3 colBefore = col;
  float r2 = shapeND * shapeND * 0.25;
  float gs = max(uNovaSize * uGlow * 0.003, 0.004);
  float nova = exp(-r2 / gs) + exp(-r2 / (gs * 7.0)) * 0.18;
  nova *= uWhiteGlow * (uGlow / 17.0) * 1.15;
  col += vec3(nova);

  float dC = shapeND * 0.5;
  float tR = clamp(uRingRadius, 0.1, 0.49);
  float rW = max(uRingWidth, 0.003);
  float ring = exp(-pow((dC - tR) / rW, 2.0));
  ring *= uBlueRing * (uGlow / 17.0) * 1.8;
  if (uShimmer > 0.5) ring *= sin(angle * uShimmerFreq + uTime * uShimmerSpeed) * uShimmerDepth + (1.0 - uShimmerDepth);
  float ringAura = exp(-pow((dC - tR) / (rW * 6.0), 2.0)) * 0.28 * uBlueRing * (uGlow / 17.0);
  col += uBlueColor * (ring + ringAura);
  col += vec3(exp(-pow((dC - uRimLinePos) / max(uRimLineWidth, 0.0001), 2.0)) * uRimLine);

  vec3 addc = col - colBefore;
  float addA = clamp(max(max(addc.r, addc.g), addc.b), 0.0, 1.0);
  gLensA = clamp(sampA + addA * (1.0 - sampA), 0.0, 1.0);
  outA = smoothstep(1.0, 0.93, maskND);
  return col;
}

void main(){
  vec3 base = texture2D(uTex, vUv).rgb;
  vec3 outc = base;
  float a = 0.0;
  vec3 c = discLens(uCenter, uAspect, a);
  outc = mix(outc, c, a);
  if (uVignette > 0.001) {
    vec2 vc = vUv - 0.5;
    vc.x *= uAspect;
    float d = length(vc) / max(uVignetteSize, 0.0001);
    float vig = 1.0 - uVignette * smoothstep(0.5, 1.0, d);
    outc *= clamp(vig, 0.0, 1.0);
  }
  float baseA = texture2D(uTex, vUv).a;
  gl_FragColor = vec4(outc, mix(baseA, gLensA, a));
}
`;

const LENS_FX_KEYS = ["uDispersion", "uBlueRing", "uRimLine", "uVignette", "uZoom", "uRimTangential", "uRimInward"];
const REPEATS = 4, CLICK_SLOP = 6, TOUCH_CLICK_SLOP = 12, FLICK_IDLE_MS = 90;

const prefersReducedMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const pad = (v) => String(v).padStart(2, "0");

function hexToNumber(bg) {
  const v = bg.trim();
  if (v.startsWith("#") && (v.length === 7 || v.length === 4)) {
    const hex = v.length === 4 ? `#${v[1]}${v[1]}${v[2]}${v[2]}${v[3]}${v[3]}` : v;
    const n = Number.parseInt(hex.slice(1), 16);
    return Number.isFinite(n) ? n : 0xffffff;
  }
  return 0xffffff;
}

function createCarousel(mount, cursorElement, options) {
  const reduced = prefersReducedMotion();
  const entryOn = options.entry && !reduced;
  const items = options.items;
  if (items.length === 0) return null;

  let W = Math.max(1, mount.clientWidth);
  let H = Math.max(1, mount.clientHeight);
  const panelHFor = () => Math.max(120, Math.min(options.panelHeight, Math.round(H * 0.52)));
  let PANEL_H = panelHFor();
  const GAP = options.gap;
  const EASE = reduced ? 0.28 : 0.09;
  const SNAP_EASE = reduced ? 0.22 : 0.05;
  const WHEEL = 1.4, DRAG = 1.6, TOUCH_DRAG = 1, TOUCH_EASE = 0.22, FRICTION = 0.865;
  const SNAP_IDLE_MS = 120, SHRINK_MAX = 60, SHRINK_ATTACK = 0.25, SHRINK_DECAY = 0.06;

  let renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); } catch { return null; }

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(dpr);
  renderer.setSize(W, H);
  renderer.setClearColor(0x000000, 0);
  const st = renderer.domElement.style;
  st.display = "block"; st.width = "100%"; st.height = "100%"; st.touchAction = "none"; st.userSelect = "none";
  renderer.domElement.setAttribute("aria-hidden", "true");
  mount.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-W / 2, W / 2, H / 2, -H / 2, -100, 100);
  camera.position.z = 10;

  const loader = new THREE.TextureLoader();
  loader.setCrossOrigin("anonymous");
  const sources = items.map((img) => {
    const s = { tex: null, aspect: img.aspect || PORTRAIT_ASPECT, locked: img.aspect != null };
    loader.load(img.src, (tex) => {
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.generateMipmaps = true;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      tex.colorSpace = THREE.SRGBColorSpace;
      if (!s.locked && tex.image) s.aspect = tex.image.width / tex.image.height;
      s.tex = tex;
      recomputeTotal();
      if (!userInteracted) { scroll = centerForIndex(0); target = scroll; }
    }, undefined, () => { s.aspect = s.aspect || PORTRAIT_ASPECT; });
    return s;
  });

  const slotWidth = (i) => sources[i].aspect * PANEL_H + GAP;
  let offsets = [], totalWidth = 0;
  function recomputeTotal() {
    offsets = []; let acc = 0;
    for (let i = 0; i < sources.length; i++) { offsets.push(acc); acc += slotWidth(i); }
    totalWidth = acc;
  }
  recomputeTotal();

  function centerForIndex(idx) {
    const N = sources.length;
    const loop = Math.floor(idx / N);
    const s = ((idx % N) + N) % N;
    return offsets[s] + slotWidth(s) / 2 - GAP / 2 + loop * totalWidth;
  }
  function nearestIndex(value) {
    if (!totalWidth) return 0;
    const N = sources.length;
    let best = 0, bestDist = Infinity;
    for (let i = 0; i < N; i++) {
      const center = offsets[i] + slotWidth(i) / 2 - GAP / 2;
      const k = Math.round((value - center) / totalWidth);
      const dist = Math.abs(center + k * totalWidth - value);
      if (dist < bestDist) { bestDist = dist; best = i + k * N; }
    }
    return best;
  }
  function centerIndex(value) {
    if (!totalWidth) return 0;
    let bestI = 0, bestDist = Infinity;
    for (let i = 0; i < sources.length; i++) {
      const center = offsets[i] + slotWidth(i) / 2 - GAP / 2;
      const k = Math.round((value - center) / totalWidth);
      const dist = Math.abs(center + k * totalWidth - value);
      if (dist < bestDist) { bestDist = dist; bestI = i; }
    }
    return bestI;
  }

  let lastCenter = -1;
  const pool = [];
  for (let r = 0; r < REPEATS; r++) {
    for (let i = 0; i < sources.length; i++) {
      const mat = new THREE.MeshBasicMaterial({ color: 0xdddddd, transparent: true });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1, 1, 1), mat);
      mesh.visible = false;
      scene.add(mesh);
      pool.push({ mesh, mat, srcIndex: i, bound: false });
    }
  }

  let scroll = centerForIndex(0), target = scroll;
  let userInteracted = false, velocity = 0, prevScroll = 0, scrollEnergy = 0;
  let pendingFocus = null, lastInput = performance.now(), snapped = false;

  const rt = new THREE.WebGLRenderTarget(W * dpr, H * dpr);
  const lensScene = new THREE.Scene();
  const lensCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const lensUniforms = {
    uTex: { value: rt.texture },
    uRes: { value: new THREE.Vector2(W * dpr, H * dpr) },
    uCenter: { value: new THREE.Vector2(0.5, 0.5) },
    uSizeX: { value: LENS.sizeX }, uSizeY: { value: LENS.sizeY },
    uShape: { value: 0 }, uSquareRound: { value: 0 }, uRotation: { value: 0 },
    uAspect: { value: W / H }, uZoom: { value: LENS.zoom },
    uDispersion: { value: LENS.dispersion }, uBlur: { value: LENS.blur },
    uGlow: { value: LENS.glow }, uWhiteGlow: { value: LENS.whiteGlow },
    uNovaSize: { value: LENS.novaSize }, uBlueRing: { value: LENS.blueRing },
    uRingRadius: { value: LENS.ringRadius }, uRingWidth: { value: LENS.ringWidth },
    uShimmer: { value: reduced || !LENS.shimmer ? 0 : 1 },
    uShimmerFreq: { value: LENS.shimmerFreq }, uShimmerSpeed: { value: LENS.shimmerSpeed },
    uShimmerDepth: { value: LENS.shimmerDepth }, uTime: { value: 0 },
    uRimStart: { value: LENS.rimStart }, uRimTangential: { value: LENS.rimTangential },
    uRimInward: { value: LENS.rimInward }, uRimFreq1: { value: LENS.rimFreq1 },
    uRimFreq2: { value: LENS.rimFreq2 }, uBlueColor: { value: new THREE.Color(LENS.blueColor) },
    uRimLine: { value: LENS.rimLine }, uRimLinePos: { value: LENS.rimLinePos },
    uRimLineWidth: { value: LENS.rimLineWidth }, uVignette: { value: LENS.vignette },
    uVignetteSize: { value: LENS.vignetteSize }, uSamples: { value: LENS.samples },
  };
  const lensMat = new THREE.ShaderMaterial({ uniforms: lensUniforms, vertexShader: LENS_VERTEX, fragmentShader: LENS_FRAGMENT });
  const lensQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), lensMat);
  lensQuad.visible = false;
  lensScene.add(lensQuad);

  const total = REPEATS * sources.length;
  const focusState = { active: false, srcIndex: -1, poolIdx: -1, lensFx: entryOn ? 0 : 1, anim: null };
  const drop = new Array(total).fill(0);
  let focusScale = 1;
  const lastCenterX = new Array(total);
  const pEntry = new Array(total).fill(entryOn ? 0 : 1);
  let entryActive = entryOn, entrySettled = false;
  const growArr = new Array(total).fill(entryOn ? 0 : 1);
  let entryAnim = null;

  const lensFxFull = {};
  for (const k of LENS_FX_KEYS) lensFxFull[k] = lensUniforms[k].value;

  let panelRects = [], centeredPanel = null;

  function layout() {
    panelRects = []; centeredPanel = null;
    let centeredDist = Infinity;
    const half = W / 2, buffer = PANEL_H;
    pool.forEach((p, poolIdx) => {
      const rep = Math.floor(poolIdx / sources.length);
      const i = p.srcIndex;
      const src = sources[i];
      const slotCenterInLoop = offsets[i] + slotWidth(i) / 2 - GAP / 2;
      let x = slotCenterInLoop - scroll;
      x = ((x % totalWidth) + totalWidth) % totalWidth;
      x += (rep - Math.floor(REPEATS / 2)) * totalWidth;
      if (x > half + totalWidth) x -= totalWidth * REPEATS;

      const centerX = x;
      const inEntry = entryActive || entrySettled;
      if (!inEntry && (centerX < -half - buffer || centerX > half + buffer)) {
        p.mesh.visible = false; lastCenterX[poolIdx] = undefined; return;
      }
      lastCenterX[poolIdx] = centerX;

      const shrink = 1 - 0.25 * scrollEnergy;
      const h = PANEL_H * shrink;
      const wPx = src.aspect * PANEL_H * shrink;

      if (src.tex && !p.bound) {
        p.mat.map = src.tex; p.mat.color.set(0xffffff); p.mat.needsUpdate = true; p.bound = true;
      }

      let y = 0;
      const isFocused = focusState.active && focusState.poolIdx === poolIdx;
      const d = drop[poolIdx] || 0;
      let drawW = wPx, drawH = h;
      if (isFocused) { drawW = wPx * focusScale; drawH = h * focusScale; }
      else if (d > 0) y = -d * H * FOCUS.dropDist;

      p.mesh.visible = true;
      let finalX = centerX, finalY = y, finalW = drawW, finalH = drawH;
      if (entryActive || entrySettled) {
        const pe = pEntry[poolIdx] || 0;
        const g = growArr[poolIdx] || 0;
        const curH = ENTRY.startH + (drawH - ENTRY.startH) * g;
        finalH = curH; finalW = curH * src.aspect;

        const cSrc = centerIndex(scroll);
        let di = i - cSrc;
        if (di > sources.length / 2) di -= sources.length;
        if (di < -sources.length / 2) di += sources.length;
        const N = sources.length;
        const midRep = Math.floor(REPEATS / 2);
        if (rep !== midRep) { p.mesh.visible = false; lastCenterX[poolIdx] = undefined; return; }
        const slotH = (s) => ENTRY.startH + (PANEL_H - ENTRY.startH) * (growArr[midRep * N + s] || 0);
        let off = 0;
        if (di > 0) {
          for (let k = 0; k < di; k++) {
            const sa = (((cSrc + k) % N) + N) % N, sb = (((cSrc + k + 1) % N) + N) % N;
            off += (sources[sa].aspect * slotH(sa) + sources[sb].aspect * slotH(sb)) / 2 + GAP;
          }
        } else if (di < 0) {
          for (let k = 0; k < -di; k++) {
            const sa = (((cSrc - k) % N) + N) % N, sb = (((cSrc - k - 1) % N) + N) % N;
            off -= (sources[sa].aspect * slotH(sa) + sources[sb].aspect * slotH(sb)) / 2 + GAP;
          }
        }
        finalX = off;
        if (finalX < -half - buffer || finalX > half + buffer) {
          p.mesh.visible = false; lastCenterX[poolIdx] = undefined; return;
        }
        const below = -H * ENTRY.fromBelow;
        finalY = below + (y - below) * pe;
      }

      p.mesh.position.set(finalX, finalY, 0);
      p.mesh.scale.set(finalW, finalH, 1);

      const sx = centerX + W / 2, sy = H / 2 - y;
      panelRects.push({ left: sx - drawW / 2, right: sx + drawW / 2, top: sy - drawH / 2, bottom: sy + drawH / 2, poolIdx, srcIndex: i, centerX });

      if (Math.abs(centerX) < centeredDist) {
        centeredDist = Math.abs(centerX);
        centeredPanel = { srcIndex: i, centerX, wPx, h, poolIdx };
      }
    });
  }

  const panelAtPointer = (px, py) => {
    for (const r of panelRects) if (px >= r.left && px <= r.right && py >= r.top && py <= r.bottom) return r;
    return null;
  };
  const localPoint = (e) => {
    const rect = renderer.domElement.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  };

  const el = renderer.domElement;
  let dragging = false, dragPointerId = null, dragLastX = 0, dragDist = 0, dragVel = 0, dragMoveT = 0;
  let suppressClick = false, dragPointerType = "mouse";
  let lastPointerX = NaN, lastPointerY = NaN, pointerInside = false, lastPointerType = "mouse";

  if (cursorElement) gsap.set(cursorElement, { xPercent: 20, yPercent: 30, scale: 0, autoAlpha: 0 });
  const moveX = cursorElement ? gsap.quickTo(cursorElement, "x", { duration: 0.5, ease: "power3.out" }) : null;
  const moveY = cursorElement ? gsap.quickTo(cursorElement, "y", { duration: 0.5, ease: "power3.out" }) : null;

  let overPanel = false, hoverPanel = false, cursorNow = "";
  function setCursor(v) { if (v === cursorNow) return; cursorNow = v; el.style.cursor = v; }
  function updateCursor() {
    if (focusState.active || entryActive || entrySettled) return setCursor("");
    if (dragging) return setCursor("grabbing");
    if (!hoverPanel) return setCursor("");
    return setCursor("grab");
  }
  function setHover(on) { hoverPanel = on; setView(on); }
  function refreshHover() {
    if (!pointerInside || lastPointerType !== "mouse") return;
    if (!Number.isFinite(lastPointerX)) return;
    if (focusState.active) { setHover(false); return; }
    setHover(panelAtPointer(lastPointerX, lastPointerY) !== null);
  }
  function setView(on) {
    if (entryActive || entrySettled) on = false;
    if (dragging) on = false;
    if (on === overPanel) { updateCursor(); return; }
    overPanel = on;
    updateCursor();
    if (!cursorElement) return;
    gsap.killTweensOf(cursorElement, "scale,autoAlpha,opacity,visibility");
    gsap.to(cursorElement, { scale: on ? 1 : 0, autoAlpha: on ? 1 : 0, duration: on ? 0.35 : 0.25, ease: on ? "power3.out" : "power3.in" });
  }
  const inputLocked = () => focusState.active || entryActive || entrySettled;

  function onWheel(e) {
    e.preventDefault();
    if (inputLocked()) return;
    userInteracted = true; pendingFocus = null;
    target += (e.deltaY || e.deltaX) * WHEEL;
    lastInput = performance.now(); snapped = false;
  }
  function onPointerDown(e) {
    suppressClick = false;
    if (inputLocked() || dragging) return;
    if (e.button !== 0 && e.pointerType === "mouse") return;
    dragging = true; dragPointerId = e.pointerId; dragPointerType = e.pointerType || "mouse";
    try { el.setPointerCapture(e.pointerId); } catch {}
    const p = localPoint(e);
    dragLastX = p.x; lastPointerX = p.x; lastPointerY = p.y;
    dragDist = 0; dragVel = 0; dragMoveT = performance.now();
    setView(false);
    velocity = 0; pendingFocus = null; userInteracted = true; snapped = false; lastInput = dragMoveT;
  }
  function onPointerMove(e) {
    const p = localPoint(e);
    if (dragging && e.pointerId === dragPointerId) {
      const sens = dragPointerType === "mouse" ? DRAG : TOUCH_DRAG;
      const dx = p.x - dragLastX;
      dragLastX = p.x; dragDist += Math.abs(dx); target -= dx * sens;
      dragVel = dragVel * 0.6 + -dx * sens * 0.4;
      dragMoveT = performance.now(); lastInput = dragMoveT; snapped = false;
    }
    lastPointerX = p.x; lastPointerY = p.y;
    lastPointerType = e.pointerType || "mouse";
    pointerInside = true;
    if (e.pointerType !== "mouse") return;
    if (moveX) moveX(p.x);
    if (moveY) moveY(p.y);
    if (focusState.active) { setHover(false); return; }
    setHover(panelAtPointer(p.x, p.y) !== null);
  }
  function onPointerUp(e) {
    if (!dragging) return;
    if (e && dragPointerId !== null && e.pointerId !== dragPointerId) return;
    dragging = false;
    if (dragPointerId !== null) {
      try { el.releasePointerCapture(dragPointerId); } catch {}
      dragPointerId = null;
    }
    velocity = performance.now() - dragMoveT > FLICK_IDLE_MS ? 0 : dragVel;
    dragVel = 0; lastInput = performance.now(); snapped = false;
    suppressClick = dragDist > (dragPointerType === "mouse" ? CLICK_SLOP : TOUCH_CLICK_SLOP);
    if (dragPointerType === "mouse") setHover(panelAtPointer(lastPointerX, lastPointerY) !== null);
    else updateCursor();
  }
  function onEnter(e) { pointerInside = true; lastPointerType = e.pointerType || "mouse"; }
  function onLeave() { pointerInside = false; setHover(false); }
  function onClick(e) {
    if (suppressClick) { suppressClick = false; return; }
    if (inputLocked()) return;
    const p = localPoint(e);
    const hit = panelAtPointer(p.x, p.y);
    if (!hit) return;
    if (centeredPanel && hit.poolIdx === centeredPanel.poolIdx) { pendingFocus = null; openFocus(); return; }
    userInteracted = true; velocity = 0;
    target = centerForIndex(nearestIndex(scroll + hit.centerX));
    snapped = true;
    pendingFocus = { srcIndex: hit.srcIndex };
    setView(false);
  }

  function rankBy(list, desc) {
    let rank = 0, prevDist = -1;
    return list.map((o) => {
      if (prevDist >= 0 && (desc ? prevDist - o.dist : o.dist - prevDist) > 1) rank += 1;
      prevDist = o.dist;
      return { idx: o.idx, rank };
    });
  }

  function openFocus() {
    if (focusState.active || !centeredPanel) return;
    const src = sources[centeredPanel.srcIndex];
    if (!src || !src.tex) return;

    focusState.active = true;
    focusState.srcIndex = centeredPanel.srcIndex;
    const focusPoolIdx = centeredPanel.poolIdx;
    focusState.poolIdx = focusPoolIdx;
    target = centerForIndex(nearestIndex(scroll));

    const focusX = lastCenterX[focusPoolIdx] || 0;
    const others = pool.map((_, idx) => ({ idx, x: lastCenterX[idx] }))
      .filter((o) => o.idx !== focusPoolIdx && o.x !== undefined)
      .map((o) => ({ idx: o.idx, dist: Math.abs(o.x - focusX) }))
      .sort((a, b) => a.dist - b.dist);
    const ranked = rankBy(others, false);

    for (const key of LENS_FX_KEYS) lensFxFull[key] = lensUniforms[key].value;

    if (focusState.anim) focusState.anim.kill();
    const scaleProxy = { v: focusScale };
    const tl = gsap.timeline();
    tl.to(focusState, { lensFx: 0, duration: FOCUS.lensFade, ease: "power3.out" }, 0);
    tl.to(scaleProxy, { v: FOCUS.centerScale, duration: FOCUS.focusDuration, ease: FOCUS.focusEase, onUpdate() { focusScale = scaleProxy.v; } }, 0);
    ranked.forEach((o) => tl.to(drop, { [o.idx]: 1, duration: FOCUS.cardDuration, ease: FOCUS.cardEase }, o.rank * FOCUS.stagger));
    focusState.anim = tl;
    setView(false);
    options.onFocusChange(true);
  }

  function closeFocus() {
    if (!focusState.active) return;
    if (focusState.anim) focusState.anim.kill();

    const focusX = lastCenterX[focusState.poolIdx] || 0;
    const others = pool.map((_, idx) => ({ idx, x: lastCenterX[idx] }))
      .filter((o) => o.x !== undefined && (drop[o.idx] || 0) > 0)
      .map((o) => ({ idx: o.idx, dist: Math.abs(o.x - focusX) }))
      .sort((a, b) => b.dist - a.dist);
    const ranked = rankBy(others, true);

    options.onFocusChange(false);
    const scaleProxy = { v: focusScale };
    const tl = gsap.timeline({ onComplete: () => { focusState.active = false; focusState.srcIndex = -1; updateCursor(); } });
    tl.to(focusState, { lensFx: 1, duration: FOCUS.lensFade * 0.8, ease: "power3.inOut" }, 0);
    tl.to(scaleProxy, { v: 1, duration: FOCUS.focusDuration * 0.85, ease: FOCUS.focusEase, onUpdate() { focusScale = scaleProxy.v; } }, 0);
    ranked.forEach((o) => tl.to(drop, { [o.idx]: 0, duration: FOCUS.cardDuration * 0.85, ease: FOCUS.cardEase }, o.rank * FOCUS.stagger * 0.7));
    focusState.anim = tl;
  }

  function playEntry() {
    if (!entryOn) { options.onEntryDone(true); return; }
    if (entryAnim) entryAnim.kill();
    pEntry.fill(0);
    entryActive = true; entrySettled = false;
    options.onEntryDone(false);
    growArr.fill(0);
    focusState.lensFx = 0;
    target = centerForIndex(nearestIndex(scroll));
    scroll = target; velocity = 0; snapped = true;
    layout();
    const visibleIdx = [];
    for (let k = 0; k < lastCenterX.length; k++) if (lastCenterX[k] !== undefined) visibleIdx.push(k);
    const tl = gsap.timeline({ delay: ENTRY.delay });
    const spread = ENTRY.stagger * Math.max(visibleIdx.length - 1, 1);
    let lastRiseEnd = 0;
    visibleIdx.forEach((idx) => {
      const t0 = Math.random() * spread;
      lastRiseEnd = Math.max(lastRiseEnd, t0 + ENTRY.riseDuration);
      tl.to(pEntry, { [idx]: 1, duration: ENTRY.riseDuration, ease: ENTRY.riseEase }, t0);
    });
    tl.call(() => { entryActive = false; entrySettled = true; }, [], lastRiseEnd);
    const cSrcG = centerIndex(scroll), Ng = sources.length, midRepG = Math.floor(REPEATS / 2);
    const growList = []; let maxRank = 0;
    for (let k = 0; k < lastCenterX.length; k++) {
      if (lastCenterX[k] === undefined) continue;
      if (Math.floor(k / Ng) !== midRepG) continue;
      let di = (k % Ng) - cSrcG;
      if (di > Ng / 2) di -= Ng;
      if (di < -Ng / 2) di += Ng;
      const r = Math.abs(di);
      maxRank = Math.max(maxRank, r);
      growList.push({ idx: k, rank: r });
    }
    const growRanked = growList.map((v) => ({ idx: v.idx, rank: maxRank - v.rank }));
    const growStart = lastRiseEnd + ENTRY.growDelay;
    let growEnd = growStart;
    tl.to(focusState, { lensFx: 1, duration: ENTRY.lensBloom, ease: ENTRY.lensBloomEase }, growStart);
    growRanked.forEach((o) => {
      const t0 = growStart + o.rank * ENTRY.growStagger;
      growEnd = Math.max(growEnd, t0 + ENTRY.growDuration);
      tl.to(growArr, { [o.idx]: 1, duration: ENTRY.growDuration, ease: ENTRY.growEase }, t0);
    });
    tl.call(() => {
      entrySettled = false;
      growArr.fill(1);
      options.onEntryDone(true);
      updateCursor();
    }, [], growEnd);
    entryAnim = tl;
  }

  function step(direction) {
    if (inputLocked()) return;
    userInteracted = true; velocity = 0; pendingFocus = null;
    target = centerForIndex(nearestIndex(scroll) + direction);
    snapped = true; lastInput = performance.now();
  }

  el.addEventListener("wheel", onWheel, { passive: false });
  el.addEventListener("pointerdown", onPointerDown);
  el.addEventListener("pointermove", onPointerMove);
  el.addEventListener("pointerup", onPointerUp);
  el.addEventListener("pointercancel", onPointerUp);
  el.addEventListener("pointerenter", onEnter);
  el.addEventListener("pointerleave", onLeave);
  el.addEventListener("click", onClick);

  let raf = 0, running = true, visible = true;

  function tick() {
    if (!running) return;
    if (!visible || document.hidden) { raf = 0; return; }
    if (!dragging) {
      target += velocity;
      velocity *= FRICTION;
      if (Math.abs(velocity) < 0.05) velocity = 0;
      if (!snapped && !focusState.active && performance.now() - lastInput > SNAP_IDLE_MS) {
        target = centerForIndex(nearestIndex(scroll));
        snapped = true;
      }
    }
    const follow = dragging && dragPointerType !== "mouse" ? TOUCH_EASE : snapped && !pendingFocus ? SNAP_EASE : EASE;
    scroll += (target - scroll) * follow;

    const ci = centerIndex(scroll);
    if (ci !== lastCenter) { lastCenter = ci; options.onActiveChange(ci); }

    const rawSpeed = scroll - prevScroll;
    prevScroll = scroll;
    const norm = Math.min(1, Math.abs(rawSpeed) / Math.max(1, SHRINK_MAX));
    const k = norm > scrollEnergy ? SHRINK_ATTACK : SHRINK_DECAY;
    scrollEnergy += (norm - scrollEnergy) * k;

    layout();
    refreshHover();

    if (pendingFocus && !focusState.active && Math.abs(target - scroll) < 0.5) {
      const pf = pendingFocus;
      pendingFocus = null;
      if (centeredPanel && centeredPanel.srcIndex === pf.srcIndex) openFocus();
    }

    lensUniforms.uCenter.value.set(LENS.posX, LENS.posY);
    lensUniforms.uAspect.value = W / H;
    lensUniforms.uTime.value = performance.now() * 0.001;
    const rad = (a) => (a * Math.PI) / 180;
    lensUniforms.uRotation.value = rad(LENS.rotation) + rad(LENS.spin) * (performance.now() * 0.001);
    const fx = focusState.lensFx;
    for (const key of LENS_FX_KEYS) lensUniforms[key].value = lensFxFull[key] * fx;

    renderer.setRenderTarget(rt);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    if (lensQuad.visible) renderer.render(lensScene, lensCam);
    else renderer.render(scene, camera);
    raf = requestAnimationFrame(tick);
  }
  function startLoop() { if (!running || raf) return; raf = requestAnimationFrame(tick); }

  startLoop();
  if (entryOn) playEntry(); else options.onEntryDone(true);

  function onResize() {
    W = Math.max(1, mount.clientWidth);
    H = Math.max(1, mount.clientHeight);
    PANEL_H = panelHFor();
    recomputeTotal();
    renderer.setSize(W, H);
    camera.left = -W / 2; camera.right = W / 2; camera.top = H / 2; camera.bottom = -H / 2;
    camera.updateProjectionMatrix();
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setPixelRatio(ratio);
    rt.setSize(W * ratio, H * ratio);
    lensUniforms.uRes.value.set(W * ratio, H * ratio);
    if (!userInteracted) { scroll = centerForIndex(0); target = scroll; }
  }
  const resizeObserver = new ResizeObserver(onResize);
  resizeObserver.observe(mount);
  const intersection = new IntersectionObserver(([entry]) => {
    const box = entry && entry.boundingClientRect;
    if (!box || (box.width === 0 && box.height === 0)) return;
    visible = entry.isIntersecting;
    if (visible) startLoop();
  });
  intersection.observe(mount);
  const onVisibility = () => { if (!document.hidden) startLoop(); };
  document.addEventListener("visibilitychange", onVisibility);

  function destroy() {
    running = false;
    cancelAnimationFrame(raf);
    resizeObserver.disconnect();
    intersection.disconnect();
    document.removeEventListener("visibilitychange", onVisibility);
    ["wheel:onWheel", "pointerdown:onPointerDown", "pointermove:onPointerMove", "pointerup:onPointerUp", "pointercancel:onPointerUp", "pointerenter:onEnter", "pointerleave:onLeave", "click:onClick"].forEach(() => {});
    if (focusState.anim) focusState.anim.kill();
    if (entryAnim) entryAnim.kill();
    if (cursorElement) gsap.killTweensOf(cursorElement);
    renderer.dispose(); rt.dispose();
    lensQuad.geometry.dispose(); lensMat.dispose();
    pool.forEach((p) => { p.mesh.geometry.dispose(); p.mat.dispose(); });
    sources.forEach((s) => s.tex && s.tex.dispose());
    if (el.parentNode) el.parentNode.removeChild(el);
  }

  return { closeFocus, next: () => step(1), previous: () => step(-1), destroy };
}

/* ---------- UI wiring (replaces the React component) ---------- */
const root = document.getElementById("carousel");
const mount = document.getElementById("mount");
const titleEl = document.getElementById("title");
const counterEl = document.getElementById("counter");
const cursorEl = document.getElementById("cursor");
const closeBtn = document.getElementById("close");
const liveEl = document.getElementById("live");
const fallbackEl = document.getElementById("fallback");


let active = 0, focused = false, entryDone = !OPTIONS.entry, revealPlayed = false;
const reduced = prefersReducedMotion();

function updateText() {
  const cur = ITEMS[active] || ITEMS[0];
  titleEl.textContent = cur.title;
  counterEl.textContent = `${pad(active + 1)}/${pad(ITEMS.length)}`;
  liveEl.textContent = `${cur.title}, ${pad(active + 1)} of ${pad(ITEMS.length)}${focused ? ", focused" : ""}`;
}

function updateLabels() {
  gsap.set(titleEl, { xPercent: -50 });
  gsap.set(counterEl, { xPercent: -50 });
  if (!entryDone && OPTIONS.entry && !reduced) {
    gsap.set([titleEl, counterEl], { autoAlpha: 0 });
    revealPlayed = false;
    return;
  }
  const y = focused ? window.innerHeight * -0.05 : 0;
  if (entryDone && !focused && !revealPlayed) {
    revealPlayed = true;
    gsap.fromTo(titleEl, { autoAlpha: 0 }, { autoAlpha: 1, duration: reduced ? 0 : 1.6, ease: "power2.out" });
    gsap.fromTo(counterEl, { autoAlpha: 0 }, { autoAlpha: 1, duration: reduced ? 0 : 1.6, ease: "power2.out", delay: reduced ? 0 : 0.18 });
    return;
  }
  gsap.to(titleEl, { y, autoAlpha: 1, duration: reduced ? 0 : 0.4, ease: "power3.out" });
  gsap.to(counterEl, { autoAlpha: focused ? 0 : 1, duration: reduced ? 0 : 0.4, ease: "power3.out" });
}

const engine = createCarousel(mount, cursorEl, {
  items: ITEMS,
  ...OPTIONS,
  onActiveChange: (i) => { active = i; updateText(); },
  onFocusChange: (open) => {
    focused = open;
    closeBtn.style.opacity = open ? 1 : 0;
    closeBtn.style.pointerEvents = open ? "auto" : "none";
    updateText();
    updateLabels();
  },
  onEntryDone: (done) => { entryDone = done; updateLabels(); },
});

if (!engine) {
  mount.style.display = "none";
  fallbackEl.style.display = "flex";
} else {
  updateText();
  updateLabels();
  closeBtn.addEventListener("click", () => engine.closeFocus());
  root.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") { e.preventDefault(); engine.next(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); engine.previous(); }
    else if (e.key === "Escape") { e.preventDefault(); engine.closeFocus(); }
  });
}
</script>
