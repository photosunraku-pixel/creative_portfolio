<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Portfolio – scratch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500&family=Pinyon+Script&family=Instrument+Serif&family=JetBrains+Mono:wght@500;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --ink: #121110;
            --paper: #f2f1ef;
            --cream: #faf9f6;
            --dark: #232122;
            --violet: #7c4dea;
            --serif: 'Instrument Serif', Georgia, serif;
            --mono: 'JetBrains Mono', ui-monospace, monospace;
            --wide: 'Unbounded', 'Syne', system-ui, sans-serif
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        html {
            scroll-snap-type: y proximity;
            scroll-behavior: smooth
        }

        html,
        body {
            background: var(--cream);
            color: var(--ink);
            font-family: system-ui, -apple-system, sans-serif
        }

        section {
            scroll-snap-align: start
        }

        /* ===== PAGE 1: title ===== */
        .p1 {
            position: relative;
            min-height: 100svh;
            display: grid;
            align-items: center;
            overflow: hidden;
            background: var(--cream);
            font-family: var(--wide)
        }

        .glow {
            position: absolute;
            left: 18%;
            top: 28%;
            width: 42vw;
            height: 42vw;
            border-radius: 50%;
            background: radial-gradient(circle, #fff 0%, transparent 65%);
            pointer-events: none
        }

        .ptitle {
            position: relative;
            margin-left: clamp(24px, 19vw, 300px);
            padding-bottom: 6vh
        }

        .big {
            position: relative;
            isolation: isolate;
            font-weight: 300;
            font-size: clamp(46px, 9vw, 150px);
            line-height: 1;
            letter-spacing: -.04em;
            white-space: nowrap
        }

        .fadeb {
            -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .08), #000 62%);
            mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .08), #000 62%)
        }

        .o {
            position: relative;
            display: inline-block;
            width: .8em;
            height: .6em;
            margin: 0 .05em;
            vertical-align: baseline
        }

        .o .el {
            position: absolute;
            inset: -6% -8%;
            width: 116%;
            height: 112%;
            overflow: visible
        }

        .o .star {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 1.6em;
            height: 1.6em;
            margin: -.95em 0 0 -.8em;
            filter: blur(5px);
            opacity: .92;
            animation: spin 22s linear infinite;
            z-index: -1
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .pill {
            position: absolute;
            left: .4%;
            top: 78%;
            padding: .35em 1em .4em;
            border-radius: 99px;
            background: #8b5cf6;
            color: #fff;
            font: 300 italic clamp(16px, 2.5vw, 38px)/1.1 var(--wide);
            transform: rotate(-2.5deg);
            white-space: nowrap
        }

        .sig {
            margin: clamp(34px, 8vh, 90px) 0 0 -.6%;
            font: 400 clamp(40px, 5.6vw, 84px)/1 'Pinyon Script', cursive
        }

        .hint {
            position: absolute;
            left: 50%;
            bottom: 3.5vh;
            translate: -50% 0;
            font: 500 11px var(--mono);
            letter-spacing: .2em;
            opacity: .45
        }

        /* page 1 dragon */
        .dragon {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            animation: dfade 1.6s .4s both
        }

        @keyframes dfade {
            from {
                opacity: 0
            }
        }

        .ptitle {
            z-index: 2
        }

        @media (prefers-reduced-motion:reduce) {
            .o .star {
                animation: none
            }
        }

        /* ===== PAGE 2: about / skills / tools ===== */
        .p2 {
            min-height: 100svh;
            display: grid;
            grid-template-columns: minmax(300px, 34%) 1fr;
            font-family: var(--wide);
            font-weight: 300
        }

        .ab {
            background: var(--dark);
            color: #fff;
            padding: 5vh 4vw 0;
            display: flex;
            flex-direction: column
        }

        .ab h2 {
            font-weight: 300;
            font-size: clamp(58px, 8.4vw, 128px);
            line-height: .92;
            letter-spacing: -.04em
        }

        .ab p {
            margin: 3.5vh 0 4vh;
            font-size: clamp(12px, 1.05vw, 15px);
            line-height: 1.5;
            text-align: justify;
            white-space: pre-line
        }

        .photo {
            flex: 1;
            min-height: 260px;
            border-radius: 28px 28px 0 0;
            overflow: hidden;
            background: linear-gradient(160deg, #d8d4d0, #8f8a86 60%, #2b2928);
            display: grid;
            place-items: center;
            color: #fff;
            font: 500 11px var(--mono);
            letter-spacing: .2em
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .rt {
            display: grid;
            grid-template-rows: 57fr 43fr
        }

        .sk {
            background: var(--violet);
            color: #fff;
            padding: 4vh 4vw
        }

        .sk h2,
        .tl h2 {
            font-weight: 300;
            font-size: clamp(52px, 7vw, 108px);
            line-height: 1;
            letter-spacing: -.04em
        }

        .cols {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 4vw;
            margin-top: 4vh
        }

        .tag {
            display: inline-block;
            padding: .5em 1.1em;
            border-radius: 99px;
            background: var(--dark);
            font: 300 italic clamp(14px, 1.6vw, 22px) var(--wide);
            margin-bottom: 3vh
        }

        .sk ul {
            list-style: none;
            padding: 0;
            font-size: clamp(11px, 1.05vw, 15px);
            line-height: 1.55
        }

        .sk li {
            padding-left: 1.1em;
            position: relative;
            margin-bottom: .2em
        }

        .sk li:before {
            content: '•';
            position: absolute;
            left: 0
        }

        .tl {
            background: var(--cream);
            padding: 3vh 4vw
        }

        .tl h2 {
            background: linear-gradient(90deg, #7c4dea, #b79cf5);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            width: fit-content
        }

        .tools {
            display: flex;
            flex-wrap: wrap;
            gap: clamp(12px, 1.6vw, 26px);
            margin-top: 3vh
        }

        .tool {
            display: grid;
            justify-items: center;
            gap: 8px;
            font-size: clamp(11px, 1vw, 14px)
        }

        .tool i {
            width: clamp(56px, 5.4vw, 78px);
            aspect-ratio: 1;
            border-radius: 22%;
            display: grid;
            place-items: center;
            font: 500 normal clamp(18px, 2vw, 28px) var(--wide);
            box-shadow: 0 4px 14px rgba(0, 0, 0, .12);
            overflow: hidden
        }

        .tool i img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        /* ===== PAGE 3: reels (loader -> wheel) ===== */
        .reel {
            position: relative;
            height: 100svh;
            overflow: hidden;
            display: grid;
            grid-template-rows: 84px 1fr auto;
            padding: 0 20px;
            background: var(--cream);
            font-family: var(--wide);
            font-weight: 300
        }

        .brand {
            position: absolute;
            left: 36px;
            top: 26px;
            z-index: 6;
            font: 300 76px/1 var(--wide);
            letter-spacing: -.05em;
            transform-origin: 0 0;
            pointer-events: none
        }

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            font: 300 13px var(--wide)
        }

        .top .sp {
            width: 215px
        }

        .top nav {
            display: flex;
            gap: 8px;
            margin-right: auto;
            opacity: 0;
            overflow-x: auto;
            scrollbar-width: none;
            padding: 4px
        }

        .top nav::-webkit-scrollbar {
            display: none
        }

        .f {
            font: 300 12px var(--wide);
            padding: .75em 1.3em;
            border-radius: 99px;
            border: 1px solid #d6d1e6;
            background: transparent;
            color: var(--ink);
            cursor: pointer;
            white-space: nowrap;
            transition: background .25s, color .25s, border-color .25s
        }

        .f:hover:not(:disabled) {
            border-color: var(--violet);
            color: var(--violet)
        }

        .f.on {
            background: var(--dark);
            border-color: var(--dark);
            color: #fff
        }

        .f.on:hover:not(:disabled) {
            color: #fff
        }

        .f:disabled {
            cursor: default
        }

        .f:focus-visible {
            outline: 2px solid var(--violet);
            outline-offset: 2px
        }

        .sel {
            position: absolute;
            left: 22px;
            bottom: 20px;
            z-index: 4;
            display: flex;
            align-items: flex-end;
            gap: 26px;
            padding: 14px 22px 16px;
            border-radius: 22px;
            background: rgba(250, 249, 246, .62);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            pointer-events: none;
            max-width: calc(100% - 44px)
        }

        .sel small {
            display: block;
            font: 300 10px var(--wide);
            letter-spacing: .18em;
            text-transform: uppercase;
            opacity: .6;
            margin-bottom: 6px
        }

        .sel b {
            display: block;
            font: 300 clamp(24px, 3.6vw, 54px)/1 var(--wide);
            letter-spacing: -.05em
        }

        .sel em {
            font: 300 12px var(--wide);
            font-style: normal;
            color: var(--violet);
            white-space: nowrap;
            padding-bottom: 4px
        }

        .top a {
            color: inherit;
            text-decoration: none;
            opacity: .7
        }

        .top a:hover {
            opacity: 1
        }

        .top .cta {
            opacity: 0;
            padding: .8em 1.5em;
            border-radius: 99px;
            background: var(--dark);
            color: #fff;
            opacity: 0
        }

        .top .cta:hover {
            background: var(--violet)
        }

        .stage {
            position: relative;
            perspective: 2200px;
            touch-action: pan-y;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none
        }

        .stage.drag {
            cursor: grabbing
        }

        .bound {
            position: absolute;
            inset: 0;
            overflow: hidden;
            border-radius: 28px;
            pointer-events: none
        }

        .sky {
            position: absolute;
            inset: 0;
            opacity: 0;
            background: radial-gradient(80% 55% at 78% 8%, #c9b3ff 0%, transparent 62%), radial-gradient(60% 45% at 12% 18%, #9a73f5 0%, transparent 60%), linear-gradient(#2a2160 0%, #5a37c4 40%, #8b5cf6 70%, #cfbcff 100%)
        }

        .bound.cl {
            z-index: 3
        }

        .scene {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d;
            will-change: transform
        }

        .card {
            position: absolute;
            left: 50%;
            top: 50%;
            display: block;
            width: var(--w);
            height: var(--h);
            margin: calc(var(--h)/-2) 0 0 calc(var(--w)/-2);
            transform-style: preserve-3d;
            visibility: hidden;
            will-change: transform;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            -webkit-user-drag: none
        }

        .card:focus-visible {
            outline: 3px solid var(--violet);
            outline-offset: 4px
        }

        .face {
            position: absolute;
            inset: 0;
            border-radius: 10px;
            overflow: hidden;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            box-shadow: 0 14px 34px rgba(0, 0, 0, .28)
        }

        .front img,
        .front video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            -webkit-user-drag: none
        }

        .front video {
            opacity: 0;
            transition: opacity .5s
        }

        .cap {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 22px 10px 9px;
            font: 300 10px var(--wide);
            letter-spacing: .02em;
            background: linear-gradient(transparent, rgba(0, 0, 0, .6))
        }

        .back {
            transform: rotateY(180deg);
            background: radial-gradient(circle at 30% 20%, #3a3638, var(--dark));
            display: grid;
            place-items: center;
            border: 1px solid #3d393b;
            font: 400 calc(var(--w)*.5)/1 'Pinyon Script', var(--serif);
            color: #b79cf5
        }

        .clouds {
            position: absolute;
            left: -5%;
            right: -5%;
            bottom: 0;
            height: 52%;
            will-change: transform;
            transform: translate3d(0, 100%, 0);
            visibility: hidden
        }

        .clouds i {
            position: absolute;
            border-radius: 50%
        }

        .clouds .base {
            left: 0;
            right: 0;
            bottom: 0;
            height: 55%;
            border-radius: 0;
            background: linear-gradient(#faf9f6, #ebe5f8)
        }

        .copy {
            position: relative;
            z-index: 4;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 32px;
            padding: 22px 16px 26px;
            opacity: 0
        }

        .copy h1 {
            font: 300 clamp(22px, 3.1vw, 46px)/1.08 var(--wide);
            letter-spacing: -.04em;
            max-width: 19em
        }

        .copy h1 u {
            text-decoration-thickness: 3px;
            text-underline-offset: 5px
        }

        .copy h1 sup {
            font: 400 9px var(--wide);
            margin-left: 2px;
            color: var(--violet)
        }

        .stats {
            display: flex;
            gap: 34px;
            text-align: right
        }

        .stats b {
            display: block;
            font: 300 clamp(24px, 3vw, 44px)/1 var(--wide);
            letter-spacing: -.05em;
            color: var(--violet)
        }

        .stats span {
            font: 300 9px var(--wide);
            letter-spacing: .16em;
            opacity: .6
        }

        .counter {
            position: absolute;
            right: 40px;
            bottom: 30px;
            z-index: 10;
            text-align: right;
            transition: opacity .4s
        }

        .counter small {
            display: block;
            font: 300 11px var(--wide);
            letter-spacing: .2em;
            opacity: .6;
            margin-bottom: 8px
        }

        .counter b {
            font: 300 clamp(64px, 10vw, 150px)/.9 var(--wide);
            letter-spacing: -.06em
        }

        .counter em {
            font: 300 clamp(20px, 2.2vw, 32px) var(--wide);
            font-style: normal;
            margin-left: 8px;
            color: var(--violet)
        }

        .skip {
            position: absolute;
            left: 36px;
            bottom: 30px;
            z-index: 10;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid #d6d1e6;
            background: transparent;
            cursor: pointer;
            font-size: 16px;
            color: var(--ink)
        }

        .skip:hover {
            background: var(--violet);
            color: #fff;
            border-color: var(--violet)
        }

        .skip:focus-visible {
            outline: 2px solid var(--violet);
            outline-offset: 3px
        }

        @media (max-width:860px) {
            .p2 {
                grid-template-columns: 1fr
            }

            .ab {
                padding-bottom: 0
            }

            .photo {
                min-height: 340px
            }

            .cols {
                grid-template-columns: 1fr
            }

            .rt {
                grid-template-rows: auto auto
            }

            .sk,
            .tl {
                padding: 6vh 6vw
            }

            .ab {
                padding: 6vh 6vw 0
            }
        }

        @media (max-width:760px) {
            .reel {
                grid-template-rows: 64px 1fr auto;
                padding: 0 10px
            }

            .brand {
                font-size: 54px;
                left: 20px;
                top: 18px
            }

            .top .sp {
                width: 135px
            }

            .top nav {
                gap: 6px
            }

            .f {
                font-size: 11px;
                padding: .7em 1.05em
            }

            .top .cta {
                display: none
            }

            .copy {
                flex-direction: column;
                align-items: flex-start;
                gap: 14px
            }

            .stats {
                text-align: left;
                gap: 22px
            }

            .counter {
                right: 20px
            }

            .skip {
                left: 20px
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script>
        const h = React.createElement;
        const { useRef, useEffect, useState } = React;
        const { motion, animate, useMotionValue } = Motion;

        /* ================= CONFIG: everything you'll want to edit ================= */
        const NAME = 'Madhav', ROLE = 'video editor';
        const BRAND = NAME.split(' ')[0] + '.', MONO = NAME[0];          // reel wordmark + card-back monogram
        const SKY_IMAGE = 'aesthetic-cloud-wallpaper.jpg';   // <- YOUR background image for the reels frame, e.g. 'sky.jpg'. '' = purple gradient
        const PHOTO = '';       // <- ONLY your portrait for the About page. Do not put the sky image here. '' = placeholder
        const ABOUT = `I'm a creative who loves connecting with people and bringing ideas to life through visual storytelling.

I specialize in video editing and content creation for brands and creators, helping them tell their stories in fresh, engaging ways. From the first cut to the final grade, I turn raw footage into scroll-stopping visuals that capture attention and emotion.`;
        const HARD = ['Video editing for social & brand films', 'Colour grading', 'Motion graphics & titles', 'Sound design & mixing', 'Short-form storytelling & pacing'];
        const SOFT = ['Creativity', 'Strong visual sense', 'Attention to detail', 'Responsibility', 'Adaptability', 'Self-management'];
        const TOOLS = [                                                  // add img:'logo.png' to use a real logo
            { n: 'capcut', t: 'CC', bg: '#fff', fg: '#111' }, { n: 'premiere', t: 'Pr', bg: '#00005b', fg: '#9999ff' },
            { n: 'after effects', t: 'Ae', bg: '#00005b', fg: '#d291ff' }, { n: 'davinci', t: 'Dv', bg: '#151515', fg: '#f2b134' },
            { n: 'photoshop', t: 'Ps', bg: '#001e36', fg: '#31a8ff' }, { n: 'figma', t: 'Fi', bg: '#1e1e1e', fg: '#f24e1e' },
            { n: 'notion', t: 'N', bg: '#111', fg: '#fff' }, { n: 'midjourney', t: 'Mj', bg: '#fff', fg: '#111' }
        ];
        const STATS = [['12.7M+', 'VIEWS'], ['35.1K', 'FOLLOWERS'], ['120+', 'EDITS']];
        const VIDEOS = [
            'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',
            'https://www.w3schools.com/html/mov_bbb.mp4'
        ];
        const CATEGORIES = [                                             // the filter buttons (id is used by WORK below)
            { id: 'cinematics', label: 'Cinematics' }, { id: 'motivation', label: 'Motivation' },
            { id: 'transitions', label: 'Transitions' }, { id: 'brand', label: 'Tuff Brand' }, { id: 'misc', label: 'Misc' }
        ];
        const PALETTE = [['#8b5cf6', '#1d1a2e'], ['#b79cf5', '#2a2160'], ['#232122', '#7c4dea'], ['#cfbcff', '#3b2a8f'], ['#7c4dea', '#121110']];
        /* ========================================================================== */

        const N = 34, STEP = 360 / N;
        const cover = (a, b, n) => 'data:image/svg+xml,' + encodeURIComponent(
            `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="360" height="640" fill="url(#g)"/><text x="28" y="108" font-family="Georgia,serif" font-size="64" font-style="italic" fill="#fff" fill-opacity=".85">${n}</text></svg>`);
        /* WORK: every video on the wheel. Placeholder entries below (3 per category).
           Replace with your own, e.g. { cat: 'cinematics', title: 'Desert film', cover: 'desert.jpg', video: 'desert.mp4' } */
        const WORK = [1, 2, 3].flatMap(n => CATEGORIES.map((c, ci) => ({
            cat: c.id, title: `${c.label} ${String(n).padStart(2, '0')}`,
            cover: cover(PALETTE[ci][0], PALETTE[ci][1], String(n).padStart(2, '0')), video: VIDEOS[(ci + n) % VIDEOS.length]
        })));
        const UNIQUE_VIDEOS = [...new Set(WORK.map(w => w.video))];
        const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
        const wrap = a => ((a + 180) % 360 + 360) % 360 - 180;
        const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
        const lerp = (a, b, t) => a + (b - a) * t;
        const put = (el, k, v) => { const c = el.__c || (el.__c = {}); if (c[k] === v) return; c[k] = v; el.style[k] = v; };

        /* ======================================================
           PAGE 1: title
           ====================================================== */
        const STAR = Array.from({ length: 32 }, (_, i) => {
            const a = i * Math.PI / 16, r = i % 2 ? 30 : 48;
            return (50 + r * Math.cos(a)).toFixed(1) + ',' + (50 + r * Math.sin(a)).toFixed(1);
        }).join(' ');

        /* ======================================================
           PAGE 1 EXTRA: a dragon on a chain (canvas 2D) chasing an invisible target that
           wanders the right side on its own and follows your cursor while you move it over the page.
           ====================================================== */
        function Dragon() {
            const ref = useRef();
            useEffect(() => {
                const cv = ref.current, ctx = cv.getContext('2d'), box = cv.parentElement;
                const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
                const N = 56, TAU = 6.2832, P = [], S = [], dust = [];

                    if (!inView || !coversReady || dealStarted || skipped) return; dealStarted = true;
                    liveRef.current = true; setStarted(true);
                    dealAnim = animate(deal, 1, { duration: 2.6, ease: 'linear', onComplete: () => { dealDone = true; maybeLift(); } });
                };
                skipRef.current = () => {
                    if (doneRef.current || !liveRef.current) return; skipped = true;
                    dealAnim && dealAnim.stop(); liftAnim && liftAnim.stop();
                    deal.set(1); lift.set(1); setUi({ on: true, delay: 0, instant: true }); finish();
                };

                const imgs = [...document.querySelectorAll('.cover')];
                const total = imgs.length + UNIQUE_VIDEOS.length + (SKY_IMAGE ? 1 : 0); let n = 0;
                const bump = () => { S.real = Math.round(++n / total * 100); };
                const covers = Promise.all(imgs.map(im => (im.decode ? im.decode() : Promise.resolve()).catch(() => { }).then(bump)));
                const previews = Promise.all([...UNIQUE_VIDEOS, ...(SKY_IMAGE ? [SKY_IMAGE] : [])].map(src => new Promise(res => {
                    const v = document.createElement('video'); let fin = false;
                    const ok = () => { if (fin) return; fin = true; bump(); res(); };
                    if (src === SKY_IMAGE) { const im = new Image(); im.onload = im.onerror = ok; setTimeout(ok, 5000); im.src = src; return; }
                    v.preload = 'metadata'; v.muted = true;
                    v.addEventListener('loadedmetadata', ok); v.addEventListener('error', ok);
                    setTimeout(ok, 5000); v.src = src;
                })));
                covers.then(() => { coversReady = true; tryDeal(); });
                Promise.all([covers, previews]).then(() => { ready = true; maybeLift(); });

                const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { inView = true; tryDeal(); io.disconnect(); } }, { threshold: 0.6 });
                io.observe(secRef.current);

                const onKey = e => { if (e.key === 'Escape' || e.key === 'Tab') skipRef.current(); };
                window.addEventListener('keydown', onKey);
                return () => { window.removeEventListener('keydown', onKey); io.disconnect(); };
            }, []);

            /* 5. GESTURES: drag, swipe, horizontal wheel -> target angle (vertical wheel scrolls the page) */
            useEffect(() => {
                const stage = stageRef.current, DEG_PER_PX = 0.09;
                let down = false, startX = 0, lastX = 0, lastT = 0;
                const pd = e => {
                    if (e.button > 0) return;
                    down = true; S.drag = true; S.vel = 0; S.dragged = false;
                    startX = lastX = e.clientX; lastT = performance.now(); stage.classList.add('drag');
                };
                const pm = e => {
                    if (!down) return;
                    const now = performance.now(), dd = (e.clientX - lastX) * DEG_PER_PX;
                    if (Math.abs(e.clientX - startX) > 5) S.dragged = true;
                    S.target += dd;
                    const dt = Math.max(1, now - lastT) / 1000;
                    S.vel = S.vel * 0.6 + (dd / dt) * 0.4;
                    lastX = e.clientX; lastT = now;
                };
                const pu = () => {
                    if (!down) return; down = false; S.drag = false; stage.classList.remove('drag');
                    if (performance.now() - lastT > 80) S.vel = 0;
                    S.vel = clamp(S.vel, -700, 700);
                };
                const wheel = e => {
                    const horiz = Math.abs(e.deltaX) > Math.abs(e.deltaY) || e.shiftKey;
                    if (!horiz) return;                                          // let vertical scroll move the page
                    e.preventDefault();
                    S.target -= (e.deltaX || e.deltaY) * 0.04;
                };
                stage.addEventListener('pointerdown', pd);
                window.addEventListener('pointermove', pm);
                window.addEventListener('pointerup', pu);
                window.addEventListener('pointercancel', pu);
                stage.addEventListener('wheel', wheel, { passive: false });
                return () => {
                    stage.removeEventListener('pointerdown', pd); window.removeEventListener('pointermove', pm);
                    window.removeEventListener('pointerup', pu); window.removeEventListener('pointercancel', pu);
                    stage.removeEventListener('wheel', wheel);
                };
            }, []);

            const fade = y => ({
                initial: false,
                animate: { opacity: ui.on ? 1 : 0, y: ui.on ? 0 : y },
                transition: { duration: ui.instant ? 0 : 0.9, delay: ui.delay, ease: 'easeOut' }
            });
            /* FILTERS: click a category to re-deal the wheel with only those videos; click it again to show everything */
            const list = applied ? WORK.filter(w => w.cat === applied) : WORK;
            const slots = Array.from({ length: N }, (_, i) => list[i % list.length]);        // fill the full wheel from the list
            const selCount = (sel ? WORK.filter(w => w.cat === sel) : WORK).length;
            const selLabel = sel ? CATEGORIES.find(c => c.id === sel).label : 'All work';
            const pick = id => {
                if (!doneRef.current) return;
                const next = sel === id ? null : id;
                setSel(next);
                if (reduce) { resetRef.current(); setApplied(next); return; }
                dealAnimRef.current && dealAnimRef.current.stop();
                dealAnimRef.current = animate(deal, 0, {
                    duration: 0.45, ease: [0.5, 0, 0.9, 0.4], onComplete: () => {
                        ReactDOM.flushSync(() => setApplied(next));                                 // swap the videos while the deck is hidden
                        resetRef.current();
                        dealAnimRef.current = animate(deal, 1, { duration: 1.6, ease: 'linear' });  // deal the new hand
                    }
                });
            };
            const U = (c, t, n) => h('span', null, h('u', { style: { textDecorationColor: c } }, t), h('sup', null, n));

            return h('section', { className: 'reel', id: 'reel', ref: secRef },
                h(motion.div, {
                    className: 'brand', initial: false, animate: { scale: ui.on ? 0.42 : 1 },
                    transition: { duration: ui.instant ? 0 : 1.5, ease: [0.5, 0, 0.15, 1] }
                }, BRAND),
                h('header', { className: 'top' },
                    h('span', { className: 'sp' }),
                    h(motion.nav, { 'aria-label': 'Filter videos', ...fade(-10) },
                        CATEGORIES.map(c => h('button', { key: c.id, className: 'f' + (sel === c.id ? ' on' : ''), 'aria-pressed': sel === c.id, disabled: !done, onClick: () => pick(c.id) }, c.label))),
                    h(motion.a, { className: 'cta', href: '#contact', ...fade(-10) }, "Let's talk")),
                h('div', {
                    className: 'stage', ref: stageRef,
                    onClickCapture: e => { if (S.dragged) { e.preventDefault(); e.stopPropagation(); S.dragged = false; } }
                },
                    h('div', { className: 'bound' }, h('div', { className: 'sky', ref: skyRef, style: SKY_IMAGE ? { backgroundImage: `url("${SKY_IMAGE}")`, backgroundSize: 'cover', backgroundPosition: 'center' } : undefined })),
                    h('div', { className: 'scene', ref: sceneRef },
                        slots.map((c, i) => h('a', { key: i, className: 'card', href: '#work-' + (i + 1), draggable: false, 'aria-label': c.title + ' – watch project' },
                            h('div', { className: 'face front' },
                                h('img', { className: 'cover', src: c.cover, alt: '', draggable: false }),
                                h('video', { src: c.video, loop: true, muted: true, playsInline: true, preload: 'none', tabIndex: -1, 'aria-hidden': true }),
                                h('div', { className: 'cap' }, c.title)),
                            h('div', { className: 'face back', 'aria-hidden': true }, MONO)))),
                    h(motion.div, { className: 'sel', ...fade(12) },
                        h('div', null,
                            h('small', null, sel ? 'Now showing · tap again to clear' : 'Now showing'),
                            h(motion.b, { key: sel || 'all', initial: { opacity: 0, y: 10 }, animate: { opacity: 1, y: 0 }, transition: { duration: 0.5 } }, selLabel)),
                        h('em', null, selCount + (selCount === 1 ? ' video' : ' videos')))),
                h(motion.div, { className: 'copy', ...fade(20) },
                    h('h1', null, 'I cut films for ', U('#7c4dea', 'brands', '01'), ', reels for ', U('#232122', 'creators', '02'), ' and trailers for ', U('#b79cf5', 'stories', '03'), '.'),
                    h('div', { className: 'stats' }, STATS.map(([v, l]) => h('div', { key: l }, h('b', null, v), h('span', null, l))))),
                !done && h('div', { className: 'counter', style: { opacity: ui.on ? 0 : 1 } },
                    h('small', null, 'LOADING REELS'), h('b', { ref: numRef }, '000'), h('em', null, '%')),
                started && !done && h('button', { className: 'skip', 'aria-label': 'Skip intro', title: 'Skip intro', onClick: () => skipRef.current() }, '↗'));
        }

        function Site() { return h(React.Fragment, null, h(Intro), h(About), h(ReelHero)); }
        ReactDOM.createRoot(document.getElementById('root')).render(h(Site));
    </script>
</body>

</html>
